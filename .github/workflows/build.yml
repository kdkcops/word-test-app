name: build-apk
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare signing key (from repository secrets)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        env:
          BUILD_NUM: ${{ github.run_number }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk WordTest-v${{ github.run_number }}.apk
          gh release create "v${{ github.run_number }}" "WordTest-v${{ github.run_number }}.apk" --title "단어 테스트 v${{ github.run_number }}" --notes "자동 빌드"
