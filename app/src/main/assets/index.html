<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>중등수능 단어 테스트</title>
<style>
/* Layout: one narrow column, quiz card centered like a flash card on a notebook page */
:root{
  --paper:#f5f7fb; --card:#ffffff; --ink:#18233d; --muted:#5d6a85; --line:#d9e0ec;
  --accent:#2f5fd0; --accent-soft:#e3ebfb; --good:#1f8a5b; --good-soft:#e1f3ea;
  --mark:#d6337a; --mark-soft:#fbe4ee;
  --f-word:"Literata",Georgia,serif; --f-ui:"IBM Plex Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11151f; --card:#1a2030; --ink:#e7ecf6; --muted:#9aa6bf; --line:#2c3549;
  --accent:#7ea2ff; --accent-soft:#22305a; --good:#4cc490; --good-soft:#163829;
  --mark:#ff7aae; --mark-soft:#4a1f33; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11151f; --card:#1a2030; --ink:#e7ecf6; --muted:#9aa6bf; --line:#2c3549;
  --accent:#7ea2ff; --accent-soft:#22305a; --good:#4cc490; --good-soft:#163829;
  --mark:#ff7aae; --mark-soft:#4a1f33; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
h1{font-size:22px;margin:0;text-wrap:balance}
h2{font-size:15px;margin:0;color:var(--muted);font-weight:700;letter-spacing:.02em}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
section{display:flex;flex-direction:column;gap:10px}
.days{display:grid;grid-template-columns:1fr;gap:8px}
.day{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;cursor:pointer}
.day input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.day b{font-family:var(--f-word);font-size:17px;min-width:62px}
.day span{color:var(--muted);font-size:14px;flex:1;min-width:0}
.day small{color:var(--muted);font-variant-numeric:tabular-nums}
.day:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:11px 16px;cursor:pointer;font-weight:500}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--card);font-weight:700}
button.danger{color:var(--mark);border-color:var(--mark-soft)}
button.small{padding:6px 10px;font-size:13px}
button:disabled{opacity:.45;cursor:default}
.grow{flex:1}
/* quiz */
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12px}
.pill.review{background:var(--mark-soft);color:var(--mark)}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:28px 20px;display:flex;flex-direction:column;gap:16px;align-items:stretch}
.code{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}
.word{font-family:var(--f-word);font-weight:800;font-size:clamp(32px,10vw,44px);text-align:center;word-break:break-word;line-height:1.15}
.spkrow{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap}
.spk{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:8px 16px;color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft);font-weight:700}
.astat{font-size:12px;color:var(--mark);text-align:center;word-break:break-all}
.astat:empty{display:none}
.spk:active{transform:scale(.96)}
.auto{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
.auto input{accent-color:var(--accent);width:16px;height:16px}
#ans{font:inherit;font-size:18px;padding:13px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);width:100%}
.fb{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.fb.ok{background:var(--good-soft);color:var(--good)}
.fb.no{background:var(--mark-soft);color:var(--mark)}
.fb .m{color:var(--ink);font-size:16px;font-weight:500}
.fb .yours{color:var(--muted);font-size:13px}
/* result */
.score{display:flex;align-items:baseline;gap:8px;justify-content:center}
.score b{font-family:var(--f-word);font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.score span{font-size:20px;color:var(--muted)}
.center{text-align:center}
.list{background:var(--card);border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.li{display:flex;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .w{font-family:var(--f-word);font-weight:600;min-width:110px}
.li .k{flex:1;min-width:0;color:var(--muted);font-size:14px}
.li .n{font-size:12px;color:var(--mark);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.li .s{font-variant-numeric:tabular-nums;font-weight:700}
.empty{color:var(--muted);font-size:14px;padding:14px;text-align:center}
.tabs{display:flex;gap:6px;border-bottom:1.5px solid var(--line)}
.tabs button{border:0;border-radius:0;background:none;padding:10px 12px;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1.5px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--mark)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
html,body{margin:0}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.day.custom{cursor:default;flex-wrap:wrap;gap:8px}
.day .cl{display:flex;align-items:center;gap:12px;flex:1;min-width:0;cursor:pointer}
.day .ct{font-family:var(--f-ui);font-size:15px;font-weight:700;min-width:0;flex:1;word-break:keep-all;overflow-wrap:anywhere}
.day.custom:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.acts{display:flex;gap:6px}
.camera{width:100%;padding:14px;border-style:dashed;border-color:var(--accent);color:var(--accent);font-weight:700;background:var(--card)}
.row.sticky{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--paper);padding-block:6px;margin-inline:-4px;padding-inline:4px}
.status{background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:500}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field input,.erow input{font:inherit;font-size:15px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);min-width:0}
.erows{display:flex;flex-direction:column;gap:6px}
.erow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto;gap:6px;align-items:center}
.erow .ew{font-family:var(--f-word);font-weight:600}
button.x{padding:6px 9px;color:var(--muted)}
.li .x{margin-left:auto}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:99px;font-size:14px;z-index:50;max-width:calc(100% - 32px);text-align:center}
</style></head><body><div class="wrap" id="app"></div>
<script src="audio.js"></script><script src="parse.js"></script><script src="app.js"></script></body></html>
